[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "MCP tool lockfile + cross-tool data-flow policy gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
langgraph = ["langchain>=1.5,<1.6", "langgraph>=1.2.22,<1.3"]
agentdojo = ["agentdojo>=0.1.35,<0.2"]
dev = ["mcp>=1.0", "pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: spawns real gateway and fake MCP server processes"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["ref"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"tests/adapters/**" = ["E501", "E402"]
"examples/**" = ["E501", "E402"]
"bench/**" = ["E501", "E402"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

# Adapters for optional frameworks: type-checked when the framework is installed, tolerated when not.
[[tool.mypy.overrides]]
module = ["agentguard.adapters.agentdojo.*", "agentguard.adapters.langgraph.*"]
ignore_missing_imports = true
disallow_subclassing_any = false
disallow_any_unimported = false
warn_return_any = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["agentdojo.*", "langgraph.*", "langchain.*", "langchain_core.*"]
ignore_missing_imports = true
