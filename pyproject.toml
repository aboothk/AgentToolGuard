[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentguard"
version = "0.1.0"
description = "MCP tool lockfile + cross-tool data-flow policy gateway"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.0",  # only used to read the supported protocol versions
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "hypothesis>=6", "ruff", "mypy", "types-PyYAML"]

[project.scripts]
agentguard = "agentguard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/agentguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: spawns real gateway and fake MCP server processes"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["ref"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"examples/**" = ["E501", "E402"]
"bench/**" = ["E501", "E402"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]
